<!doctype html>
<html lang="uk">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Локальний помічник для опису фотографій через Ollama." />
    <title>Помічник для опису фотографій</title>
    <link href="/src/style.css" rel="stylesheet" />
  </head>
  <body class="min-h-screen bg-cream-light text-ink antialiased">
    <main class="mx-auto max-w-5xl px-4 py-8 sm:px-6 sm:py-12">
      <header class="mb-8">
        <span class="mb-4 block h-1 w-12 rounded-full bg-sun" aria-hidden="true"></span>
        <h1 class="text-3xl font-bold tracking-tight text-forest sm:text-4xl">Помічник для опису фотографій</h1>
        <p class="mt-3 max-w-2xl text-base leading-relaxed text-forest/80">Оберіть локальну модель, прикріпіть фото та отримайте його опис українською.</p>
      </header>

      <section class="mb-6 rounded-2xl border border-cream-dark bg-paper p-5 sm:p-6" aria-label="Налаштування моделі">
        <div class="flex flex-col gap-4 sm:flex-row sm:items-end">
          <div class="min-w-0 flex-1">
            <label for="model" class="mb-2 block text-sm font-medium text-forest">Модель Ollama</label>
            <select id="model" disabled class="w-full rounded-lg border border-forest/30 bg-paper px-3 py-2.5 text-sm text-ink outline-none focus:border-forest focus:ring-2 focus:ring-sun/40 disabled:bg-cream-light disabled:text-muted">
              <option value="">Завантажуємо список моделей…</option>
            </select>
          </div>
          <button id="refresh-models" type="button" class="rounded-lg border border-forest px-4 py-2.5 text-sm font-medium bg-forest text-cream transition enabled:hover:bg-forest-dark enabled:hover:text-cream focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-forest disabled:cursor-not-allowed disabled:opacity-50">Оновити список</button>
        </div>
        <div class="mt-3 flex flex-wrap items-center gap-x-3 gap-y-1 text-sm">
          <div class="flex flex-row items-center gap-1.5">
            <div id="status-indicator" class="h-2 w-2 rounded-full bg-sun transition-colors duration-600 animate-pulse"></div>
            <p id="connection-status" role="status" class="text-forest">Ollama</p>
          </div>
          <div class="h-4 w-px bg-forest/30" aria-hidden="true"></div>
          <p class="text-forest/80">Модель має підтримувати зображення.</p>
        </div>
      </section>

      <div id="error" role="alert" hidden class="mb-6 rounded-xl border border-red-200 bg-red-50 px-4 py-3 text-sm leading-relaxed text-red-800"></div>

      <div class="grid items-start gap-6 md:grid-cols-2">
        <section class="rounded-2xl border border-cream-dark bg-paper p-5 shadow-sm shadow-forest/5 sm:p-6" aria-labelledby="photo-heading">
          <h2 id="photo-heading" class="text-lg font-semibold text-forest">Фотографія</h2>
          <label for="photo" class="mt-4 mb-2 block text-sm font-medium text-forest">Прикріпити фото
            <input id="photo" type="file" accept="image/jpeg,image/png,image/webp" aria-describedby="photo-help" class="pt-2 block w-full min-w-0 text-sm text-muted file:mr-3 file:cursor-pointer file:rounded-lg file:border-0 file:bg-sun/20 file:px-4 file:py-2.5 file:font-medium file:text-forest hover:file:bg-sun/30 disabled:opacity-50" />
          </label>
          <p id="photo-help" class="mt-2 text-xs text-muted">JPG, PNG або WebP, до 10 МБ.</p>
          <div class="mt-5 overflow-hidden rounded-xl border border-cream-dark bg-cream-light">
            <div id="empty-preview" class="flex aspect-4/3 items-center justify-center px-6 text-center text-sm text-muted">Тут з’явиться прикріплена фотографія</div>
            <div id="preview-container" hidden>
              <img id="preview" alt="Попередній перегляд прикріпленої фотографії" class="h-80 w-full object-contain p-3" />
              <p id="file-info" class="border-t border-cream-dark bg-paper px-3 py-2 text-xs break-all text-muted"></p>
            </div>
          </div>
          <button id="describe" type="button" disabled class="mt-5 flex w-full items-center justify-center gap-2 rounded-lg bg-forest px-4 py-3 text-sm font-semibold text-cream transition enabled:hover:bg-forest-dark focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-forest disabled:cursor-not-allowed disabled:bg-cream disabled:text-forest/50">
            <svg id="spinner" hidden aria-hidden="true" class="size-4 animate-spin" viewBox="0 0 24 24" fill="none">
              <circle class="opacity-25" cx="12" cy="12" r="9" stroke="currentColor" stroke-width="3"></circle>
              <path d="M21 12a9 9 0 0 0-9-9" stroke="currentColor" stroke-width="3" stroke-linecap="round"></path>
            </svg>
            <span id="describe-label">Створити опис</span>
          </button>
        </section>

        <section id="result-panel" aria-labelledby="result-heading" aria-busy="false" class="rounded-2xl border border-cream-dark bg-paper p-5 shadow-sm shadow-forest/5 sm:p-6">
          <h2 id="result-heading" class="text-lg font-semibold text-forest">Опис фотографії</h2>
          <p id="result-status" role="status" class="mt-2 text-sm leading-relaxed text-muted">Оберіть фото та натисніть «Створити опис».</p>
          <div id="result" class="mt-5 min-h-60 whitespace-pre-wrap text-base leading-relaxed wrap-break-word text-ink"></div>
        </section>
      </div>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
